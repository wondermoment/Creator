version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: creator_postgres
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator_dev_2025
      POSTGRES_DB: creator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://creator:creator_dev_2025@postgres:5432/creator_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
