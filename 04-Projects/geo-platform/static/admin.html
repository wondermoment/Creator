<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技术管理后台 · 品牌铸匠</title><link rel="stylesheet" href="/static/style.css"><script src="/static/admin.js?v=20261004-76" defer></script><body><main style="max-width:1050px;margin:40px auto;padding:28px"><a href="/">返回业务工作台</a><h1>技术管理后台</h1><p>独立技术授权 · 企业空间管理员不自动具有核心配置权限</p><div id="admin-status" role="status">正在验证权限…</div><section id="admin-content" hidden><label>企业空间<select id="admin-project"></select></label><h2>Soul 与专家职责</h2><label>专家<select id="admin-agent"></select></label><form id="soul-form"><label>核心配置<textarea id="soul-text" rows="18" minlength="20" maxlength="24000" required></textarea></label><button type="submit">保存 Soul 新版本</button></form><h2>Skill 提示词</h2><label>Skill<select id="admin-skill"></select></label><form id="skill-form"><label>名称<input id="skill-name" required maxlength="120"></label><label>提示词<textarea id="skill-text" rows="15" minlength="5" maxlength="12000" required></textarea></label><button type="submit">保存 Skill 新版本</button></form><h2>专家执行记录</h2><p>当前企业最近80项执行任务中的专家对话，包含功能验收记录；仅供技术排查。</p><div id="admin-execution"></div></section></main></body></html>
