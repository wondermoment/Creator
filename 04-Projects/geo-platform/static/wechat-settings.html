<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公众号绑定与草稿 · 品牌铸匠</title><link rel="stylesheet" href="/static/style.css"><script src="/static/wechat-settings.js?v=20261005-83" defer></script><body><main style="max-width:850px;margin:32px auto;padding:24px"><a href="/">返回工作台</a><h1>公众号绑定与草稿</h1><p>文章保留文字与独立配图，保存到微信草稿箱后，由你预览并决定群发。</p><p id="status" role="status">正在读取…</p><label>企业空间<select id="project"></select></label><section id="binding" hidden><h2>公众号接口配置</h2><form id="config-form"><label>公众号名称<input id="name" maxlength="120"></label><label>AppID<input id="appid" required pattern="wx[0-9a-fA-F]{16}" autocomplete="off"></label><label>AppSecret<input id="secret" type="password" maxlength="256" autocomplete="new-password" placeholder="留空保留已保存密钥；不回显"></label><p id="secret-status"></p><button type="submit">加密保存配置</button> <button type="button" id="test">测试连接与草稿读取权限</button></form><p id="connection"></p><p id="ip"></p><p>白名单添加微信测试返回的出口 IP。草稿读取通过后，还需一次真实保存验证写入权限。</p></section><section id="draft" hidden><h2>确认这版文章</h2><p id="article"></p><a id="preview">查看文字与配图排版</a><p>仅保存草稿，不改变本地审批状态，也不群发。重复提交同一版会返回已有记录。结果未知时先核对公众号，避免重复。</p><label><input type="checkbox" id="confirm">我已检查这版图文，确认上传到已绑定公众号草稿箱</label><button id="sync">确认并存入草稿箱</button><p id="receipt" role="status"></p></section></main></body></html>
